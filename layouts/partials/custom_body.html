{{ if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true, theme: "neutral" });
</script>
<style>
  pre.mermaid {
    background: none;
    display: flex;
    justify-content: center;
  }
</style>
{{ end }}
<script src="/highlight.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('code.language-f-tree').forEach(function(el) {
      hljs.highlightElement(el);
    });
  });
</script>
<style>
  :root {
    --width: 960px;
  }

  .highlight pre,
  .code pre {
    padding-left: 1rem;
    box-sizing: border-box;
  }
  pre code.language-f-tree {
    display: block;
    padding: 1rem;
    overflow-x: auto;
    background-color: #f6f8fa;
    color: #24292e;
  }
  code.language-f-tree .hljs-keyword { color: #d73a49; }
  code.language-f-tree .hljs-literal { color: #005cc5; }
  code.language-f-tree .hljs-number { color: #005cc5; }
  code.language-f-tree .hljs-string { color: #032f62; }
  code.language-f-tree .hljs-comment { color: #6a737d; font-style: italic; }
  code.language-f-tree .hljs-variable\.constant { color: #6f42c1; }
  code.language-f-tree .hljs-punctuation { color: #24292e; }
  code.language-f-tree .hljs-title\.function\.invoke { color: #6f42c1; }

  @media (prefers-color-scheme: dark) {
    pre code.language-f-tree {
      background-color: #282a36;
      color: #f8f8f2;
    }
    code.language-f-tree .hljs-keyword { color: #ff79c6; }
    code.language-f-tree .hljs-literal { color: #bd93f9; }
    code.language-f-tree .hljs-number { color: #bd93f9; }
    code.language-f-tree .hljs-string { color: #f1fa8c; }
    code.language-f-tree .hljs-comment { color: #6272a4; }
    code.language-f-tree .hljs-variable\.constant { color: #8be9fd; }
    code.language-f-tree .hljs-punctuation { color: #f8f8f2; }
    code.language-f-tree .hljs-title\.function\.invoke { color: #50fa7b; }
  }
</style>
