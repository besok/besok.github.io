baseURL = "https://besok.github.io/"
locale = "en-us"
title = "besok"
theme = "hugo-bearblog"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[params]
  description = "Notes on robotics, industrial systems, and the software in between"
  favicon = "/favicon.svg"
  hideMadeWithLine = true

[menus]
  [[menus.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menus.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menus.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
  [[menus.main]]
    identifier = "rss"
    name = "rss"
    url = "/index.xml"
    weight = 40

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false
